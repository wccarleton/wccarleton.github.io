      <stop offset="0" stop-color="#102f3b"/>
      <stop offset="1" stop-color="#176b70"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071a20" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <g fill="none" stroke="#83c5be" stroke-width="5" opacity=".75">
    <path d="M140 155 285 95 395 190 240 300 105 265Z"/>
    <path d="M140 155 240 300M285 95 240 300M395 190 140 155"/>
    <path d="M1060 155 915 95 805 190 960 300 1095 265Z"/>
    <path d="M1060 155 960 300M915 95 960 300M805 190 1060 155"/>
