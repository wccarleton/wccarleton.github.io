    <circle cx="395" cy="190" r="18"/><circle cx="240" cy="300" r="18"/>
    <circle cx="105" cy="265" r="18"/>
  </g>
  <g fill="#ee964b">
    <circle cx="1060" cy="155" r="18"/><circle cx="915" cy="95" r="18"/>
    <circle cx="805" cy="190" r="18"/><circle cx="960" cy="300" r="18"/>
    <circle cx="1095" cy="265" r="18"/>
